name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer "cython<3"
          
      - name: Accept Android SDK Licenses
        run: |
          yes | /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug > build.log 2>&1 || true

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Show Buildozer SDK and AIDL
        if: always()
        run: |
          echo "Buildozer directory:"
          ls -la ~/.buildozer/android/platform/ || true

          echo ""
          echo "Android SDK:"
          find ~/.buildozer/android/platform -maxdepth 5 -type d -name "build-tools" -print 2>/dev/null || true

          echo ""
          echo "AIDL:"
          find ~/.buildozer/android/platform -type f -name "aidl" -print 2>/dev/null || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-debug
          path: bin/*.apk
          

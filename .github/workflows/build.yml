name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cmake ninja-build libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev \
            libgdbm-compat-dev liblzma-dev libffi-dev uuid-dev libreadline-dev \
            libncurses5-dev libncursesw5-dev zip unzip openjdk-17-jdk autoconf \
            libtool pkg-config ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cython<3.0.0" buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          

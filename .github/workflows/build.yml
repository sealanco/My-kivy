name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
    
      - name: Install System Dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev \
            libgdbm-compat-dev liblzma-dev libffi-dev uuid-dev libreadline-dev \
            libncurses5-dev libncursesw5-dev zip unzip autoconf \
            libtool libtool-bin libltdl-dev pkg-config ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev m4 lld

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cython<3.0.0" buildozer

      - name: Build APK with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          BUILDOZER_ALLOW_ROOT: "1"
        run: |
          rm -rf .buildozer/
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          

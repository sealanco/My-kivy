name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platforms;android-35"

      - name: Diagnose Android SDK and AIDL
        run: |
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "AIDL SEARCH"
          echo "========================================"
          find "$ANDROID_HOME" -type f -name "aidl" -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/" || true

          echo ""
          echo "========================================"
          echo "PATH"
          echo "========================================"
          echo "$PATH"

          echo ""
          echo "========================================"
          echo "WHICH AIDL"
          echo "========================================"
          which aidl || true

          echo ""
          echo "========================================"
          echo "AIDL VERSION"
          echo "========================================"
          aidl --version || true

      - name: Add Android SDK Build Tools to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer "cython<3"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-debug
          path: bin/*.apk
